<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do · 本地版</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="13" rx="1"/><path d="M16 7V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.3l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L2.9 9.9l6.3-.9z"/></symbol>
  <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 3.3l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L2.9 9.9l6.3-.9z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="2.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-plus-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.5 10.9c.6.4.9 1 1 1.6h5c.1-.6.4-1.2 1-1.6A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h6"/><path d="M17 15v6M14.5 18.5L17 21l2.5-2.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l.9 13h9.2l.9-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 5-2 6-2 7h16c0-1-2-2-2-7M10 20h4"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M20 5H8a4 4 0 0 0-4 4v1M7 22l-3-3 3-3M4 19h12a4 4 0 0 0 4-4v-1"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h9"/><path d="M16 15l3 3-3 3M19 18h-5"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.4a1.8 1.8 0 0 0 0-3.6H12a1.8 1.8 0 0 1 0-3.6h6.2A2.8 2.8 0 0 0 21 11a8.2 8.2 0 0 0-9-8z"/><circle cx="7.5" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="6.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="7" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 16V4M8 12l4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-3.8 3.4-6 7.5-6s7.5 2.2 7.5 6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 5h11l-2 3.5L16 12H5"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2h8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-mini" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
</svg>

<div class="app-shell" id="appShell">
  <header class="titlebar">
    <div class="titlebar-side">
      <button class="tb-btn" id="btnSidebar" title="折叠侧边栏"><svg class="ic ic-16"><use href="#i-menu"/></svg></button>
    </div>
    <div class="titlebar-main">
      <div class="tb-caption">To Do <span>本地版</span></div>
      <div class="tb-actions">
        <button class="tb-btn" id="btnSettings" title="设置与数据"><svg class="ic ic-16"><use href="#i-settings"/></svg></button>
        <button class="tb-btn" id="btnMini" title="切换到小面板"><svg class="ic ic-14"><use href="#i-mini"/></svg></button>
        <button class="tb-btn" id="btnMin" title="最小化"><svg class="ic ic-12"><use href="#i-min"/></svg></button>
        <button class="tb-btn" id="btnMax" title="最大化"><svg class="ic ic-12" id="maxIcon"><use href="#i-max"/></svg></button>
        <button class="tb-btn tb-close" id="btnClose" title="关闭"><svg class="ic ic-12"><use href="#i-close"/></svg></button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="search-wrap">
        <svg class="ic ic-16 search-icon"><use href="#i-search"/></svg>
        <input id="searchInput" type="text" placeholder="搜索" autocomplete="off" spellcheck="false">
        <button class="search-clear hidden" id="searchClear" title="清除搜索"><svg class="ic ic-12"><use href="#i-close"/></svg></button>
      </div>

      <nav class="nav" id="smartNav"></nav>
      <div class="nav-divider"></div>

      <div class="lists-head">
        <span>列表</span>
        <button class="icon-btn" id="btnNewList" title="新建列表"><svg class="ic ic-18"><use href="#i-plus"/></svg></button>
      </div>
      <div class="lists" id="listsNav"></div>

      <div class="sidebar-foot">
        <button class="new-list-btn" id="btnNewListFoot"><svg class="ic ic-16"><use href="#i-plus"/></svg> 新建列表</button>
      </div>

      <div class="new-list-editor hidden" id="newListEditor">
        <div class="nle-title">新建列表</div>
        <input id="newListName" type="text" placeholder="列表名称" maxlength="40">
        <div class="nle-colors" id="nleColors"></div>
        <div class="nle-actions">
          <button class="btn ghost" id="nleCancel">取消</button>
          <button class="btn primary" id="nleCreate">创建列表</button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="main-inner">
        <div class="page-head">
          <div class="page-head-left">
            <div class="page-icon" id="pageIcon"><svg class="ic ic-26"><use href="#i-sun"/></svg></div>
            <div class="page-titles">
              <h1 id="pageTitle">我的一天</h1>
              <div class="page-date" id="pageDate"></div>
            </div>
          </div>
          <div class="page-tools">
            <button class="tool-btn" id="btnSuggest" title="建议"><svg class="ic ic-20"><use href="#i-bulb"/></svg></button>
            <button class="tool-btn" id="btnMore" title="更多选项"><svg class="ic ic-20"><use href="#i-dots"/></svg></button>
          </div>
        </div>

        <div class="suggest-panel hidden" id="suggestPanel"></div>

        <div class="add-box" id="addBox">
          <button class="add-plus" id="addPlus" title="添加任务"><svg class="ic ic-18"><use href="#i-plus"/></svg></button>
          <input id="addInput" type="text" placeholder="添加任务" autocomplete="off" spellcheck="false" maxlength="300">
          <div class="add-tools">
            <button class="add-tool" data-act="add-tool" data-add="due" title="添加截止日期"><svg class="ic ic-18"><use href="#i-calendar"/></svg></button>
            <button class="add-tool" data-act="add-tool" data-add="remind" title="提醒我"><svg class="ic ic-18"><use href="#i-bell"/></svg></button>
            <button class="add-tool" data-act="add-tool" data-add="repeat" title="重复"><svg class="ic ic-18"><use href="#i-repeat"/></svg></button>
          </div>
          <button class="add-submit hidden" id="addSubmit">添加</button>
          <div class="add-options hidden" id="addOptions"></div>
        </div>

        <div class="task-scroll" id="taskScroll">
          <div class="task-list" id="taskList"></div>
          <section class="completed-section hidden" id="completedSection">
            <button class="completed-head" id="btnCompletedToggle">
              <svg class="ic ic-16" id="completedChevron"><use href="#i-right"/></svg>
              <span>已完成</span><span class="completed-count" id="completedCount"></span>
            </button>
            <div class="task-list" id="completedList"></div>
          </section>
          <div class="empty-state hidden" id="emptyState"></div>
        </div>

        <div class="main-footer" id="mainFooter"></div>
      </div>
    </main>

    <aside class="detail" id="detail">
      <div class="detail-inner" id="detailInner"></div>
    </aside>
  </div>
</div>

<!-- 迷你小面板：清单与详情平推切换 -->
<div class="mini-view hidden" id="miniView">
  <header class="mini-titlebar">
    <button class="mini-tb mini-back hidden" id="miniBack" title="返回任务清单"><svg class="ic ic-16"><use href="#i-back"/></svg></button>
    <div class="mini-caption" id="miniCaption">To Do · 本地版</div>
    <div class="mini-actions">
      <button class="mini-tb" id="miniViewMenu" title="切换视图"><svg class="ic ic-14"><use href="#i-menu"/></svg></button>
      <button class="mini-tb" id="miniToLarge" title="切换到大面板"><svg class="ic ic-14"><use href="#i-panel"/></svg></button>
      <button class="mini-tb" id="miniMin" title="最小化"><svg class="ic ic-12"><use href="#i-min"/></svg></button>
      <button class="mini-tb mini-close" id="miniClose" title="关闭（常驻托盘）"><svg class="ic ic-12"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <div class="mini-pages" id="miniPages">
    <div class="mini-page" id="miniListPage">
      <div class="mini-head">
        <div class="mini-head-title" id="miniListTitle">我的一天</div>
        <div class="mini-head-sub" id="miniListSub"></div>
      </div>
      <div class="mini-add">
        <svg class="ic ic-16"><use href="#i-plus"/></svg>
        <input id="miniAddInput" type="text" placeholder="添加任务" autocomplete="off" spellcheck="false" maxlength="300">
        <button id="miniAddBtn" title="添加任务">添加</button>
      </div>
      <div class="mini-list" id="miniList"></div>
      <div class="mini-foot" id="miniFoot"></div>
    </div>
    <div class="mini-page" id="miniDetailPage">
      <div class="mini-detail" id="miniDetailInner"></div>
    </div>
  </div>
</div>

<div class="pop-menu hidden" id="popMenu"></div>
<div class="toast" id="toast"></div>
<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <div class="modal-title" id="modalTitle">确认</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn danger" id="modalOk">确定</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
